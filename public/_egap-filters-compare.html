<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EGAP · filtros</title>
<link rel="stylesheet" href="/css/filament/filament/app.css">
<link rel="stylesheet" href="/css/app/table.css" id="egap-css">
<style>
  :root{
    --gray-50:oklch(0.985 0 0);--gray-100:oklch(0.967 0.001 286.375);--gray-200:oklch(0.92 0.004 286.32);
    --gray-300:oklch(0.871 0.006 286.286);--gray-400:oklch(0.705 0.015 286.067);--gray-500:oklch(0.552 0.016 285.938);
    --gray-600:oklch(0.442 0.017 285.786);--gray-700:oklch(0.37 0.013 285.805);--gray-800:oklch(0.274 0.006 286.033);
    --gray-900:oklch(0.21 0.006 285.885);--gray-950:oklch(0.141 0.005 285.823);
    --primary-500:oklch(0.769 0.188 70.08);--primary-600:oklch(0.666 0.179 58.318);
  }
  body{margin:0;background:#f4f4f5;font-family:ui-sans-serif,system-ui,sans-serif;padding:1.5rem}
  .bar{display:flex;gap:1rem;align-items:center;margin-bottom:1rem;font:600 13px ui-sans-serif;color:#3f3f46}
  .stage{position:relative;height:640px}
  /* o painel é posicionado pelo Floating UI no app; aqui fixamos a posição */
  .fi-ta-filters-dropdown > .fi-dropdown-panel{position:absolute;top:0;right:0;display:block}
</style>
</head>
<body class="fi-body">

<div class="bar">
  <label><input type="checkbox" id="toggle" checked> table.css do EGAP aplicado</label>
  <span id="info"></span>
</div>

<div class="stage">
  <div class="fi-dropdown fi-ta-filters-dropdown" id="dd"></div>
</div>

<script>
const FILTERS = [
  ['Situação do Pedido','select',['Todos','Aguardando','Em separação','Entregue']],
  ['Impresso por','select',['Todos','ANDERSON DE OLIVEIRA','BERNADETTE DA SILVA']],
  ['Ata','text',null],
  ['Atualizado por','select',['Todos','ANDERSON DE OLIVEIRA']],
  ['Nº Judicial','text',null],
  ['Pedido Validado','select',['Todos','Sim','Não']],
  ['Data Validação','text',null],
];

function field([label, type, options]) {
  const control = type === 'select'
    ? `<div class="fi-input-wrp"><select class="fi-input fi-select-input">${options.map(o=>`<option>${o}</option>`).join('')}</select></div>`
    : `<div class="fi-input-wrp"><input class="fi-input" type="text"></div>`;
  return `
    <div class="fi-sc-component-ctn">
      <div data-field-wrapper class="fi-fo-field">
        <div class="fi-fo-field-label-col"><div class="fi-fo-field-label-ctn">
          <label class="fi-fo-field-label"><span class="fi-fo-field-label-content">${label}</span></label>
        </div></div>
        <div class="fi-fo-field-content-col">${control}</div>
      </div>
    </div>`;
}

document.getElementById('dd').innerHTML = `
  <div class="fi-dropdown-trigger"><button type="button" class="fi-icon-btn">▼ Filtros</button></div>
  <div class="fi-dropdown-panel fi-width-xs">
    <div class="fi-ta-filters">
      <div class="fi-ta-filters-header">
        <h3 class="fi-ta-filters-heading">Filtros</h3>
        <div><button type="button" class="fi-link fi-color-danger"><span class="fi-link-label">Limpar filtros</span></button></div>
      </div>
      <div class="fi-sc fi-grid lg:fi-grid-cols fi-sc-has-gap"
           style="--cols-default: repeat(1, minmax(0, 1fr)); --cols-lg: repeat(6, minmax(0, 1fr))">
        ${FILTERS.map(field).join('')}
      </div>
      <div class="fi-ta-filters-actions-ctn">
        <button type="button" class="fi-btn fi-color-primary">Aplicar filtros</button>
      </div>
    </div>
  </div>`;

const sheet = document.getElementById('egap-css');
const info = document.getElementById('info');
function report() {
  const p = document.querySelector('.fi-dropdown-panel');
  const g = document.querySelector('.fi-ta-filters .fi-sc');
  const gs = getComputedStyle(g);
  info.textContent = `painel: ${Math.round(p.getBoundingClientRect().width)}px × ${Math.round(p.getBoundingClientRect().height)}px | colunas: ${gs.gridTemplateColumns}`;
}
document.getElementById('toggle').addEventListener('change', e => { sheet.disabled = !e.target.checked; setTimeout(report, 50); });
report();
</script>
</body>
</html>
