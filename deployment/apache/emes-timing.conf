# Inclua este arquivo no Apache do XAMPP depois de configurar o Alias /emes.
# Caminho sugerido: C:/xampp/apache/conf/extra/httpd-vhosts.conf

# Registra somente as requisições do projeto EMES.
SetEnvIf Request_URI "^/emes/" emes_request

# %D = duração total observada pelo Apache, em microssegundos.
# X-Request-Id e X-Livewire permitem cruzar com storage/logs/laravel.log.
LogFormat "%{%Y-%m-%d %H:%M:%S}t %h \"%r\" %>s %b %Dus \"%{X-Request-Id}o\" \"%{X-Livewire}i\"" emes_timing
CustomLog "C:/xampp/apache/logs/emes-access.log" emes_timing env=emes_request
